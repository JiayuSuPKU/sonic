name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m build compat/quadsv --outdir compat-dist
      - run: python -m twine check dist/* compat-dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: sonic-dist
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: quadsv-dist
          path: compat-dist/

  publish-sonic:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sonic-dist
          path: dist/
      - name: Publish SONIC
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  publish-quadsv:
    needs: [build, publish-sonic]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: quadsv-dist
          path: compat-dist/
      - name: Publish QuadSV compatibility package
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: compat-dist
