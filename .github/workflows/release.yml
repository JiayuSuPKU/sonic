name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - name: Pin QuadSV to this SONIC release
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          case "$RELEASE_TAG" in
            v*) version="${RELEASE_TAG#v}" ;;
            *) echo "Release tag must start with v"; exit 1 ;;
          esac
          sed -i -E \
            "s#^dependencies = \[\"sonic-spatial[^\"]*\"\]\$#dependencies = [\"sonic-spatial==${version}\"]#" \
            compat/quadsv/pyproject.toml
          grep -Fqx \
            "dependencies = [\"sonic-spatial==${version}\"]" \
            compat/quadsv/pyproject.toml
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: python -m build
      - run: python -m build compat/quadsv --outdir compat-dist
      - run: python -m twine check dist/* compat-dist/*
      - name: Verify release version and wheel ownership
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          version="$RELEASE_VERSION"
          sonic_wheel="dist/sonic_spatial-${version}-py3-none-any.whl"
          quadsv_wheel="compat-dist/quadsv-${version}-py3-none-any.whl"
          test -f "$sonic_wheel"
          test -f "$quadsv_wheel"
          unzip -Z1 "$sonic_wheel" | grep -qx 'sonic/__init__.py'
          ! unzip -Z1 "$sonic_wheel" | grep -q '^quadsv/'
          unzip -Z1 "$quadsv_wheel" | grep -qx 'quadsv/__init__.py'
          unzip -p "$quadsv_wheel" 'quadsv-*.dist-info/METADATA' |
            grep -Fx "Requires-Dist: sonic-spatial==${version}"
      - uses: actions/upload-artifact@v4
        with:
          name: sonic-dist
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: quadsv-dist
          path: compat-dist/

  publish-sonic:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sonic-dist
          path: dist/
      - name: Publish SONIC
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  publish-quadsv:
    needs: [build, publish-sonic]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: quadsv-dist
          path: compat-dist/
      - name: Publish QuadSV compatibility package
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: compat-dist
